# F1: does Fargate grant NET_ADMIN? Two pods: default, and with NET_ADMIN added.
apiVersion: v1
kind: Pod
metadata: { name: probe-default, namespace: fargate-spike, labels: { fargate: spike } }
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: public.ecr.aws/docker/library/alpine:3.20
    command: ["sh","-c"]
    args:
    - |
      apk add -q iproute2 nftables libcap >/dev/null 2>&1
      echo "CapEff: $(grep CapEff /proc/self/status)"; capsh --decode=$(grep CapEff /proc/self/status | awk '{print $2}') 2>/dev/null
      ip link add d0 type dummy 2>&1 && echo NET_ADMIN_OK || echo NET_ADMIN_DENIED
      nft list ruleset >/dev/null 2>&1 && echo NFT_OK || echo NFT_FAIL
      sleep 600
---
apiVersion: v1
kind: Pod
metadata: { name: probe-net-admin, namespace: fargate-spike, labels: { fargate: spike } }
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: public.ecr.aws/docker/library/alpine:3.20
    securityContext: { capabilities: { add: ["NET_ADMIN"] } }
    command: ["sh","-c"]
    args:
    - |
      apk add -q iproute2 nftables libcap >/dev/null 2>&1
      echo "CapEff: $(grep CapEff /proc/self/status)"; capsh --decode=$(grep CapEff /proc/self/status | awk '{print $2}') 2>/dev/null
      ip link add d0 type dummy 2>&1 && echo NET_ADMIN_OK || echo NET_ADMIN_DENIED
      nft add table inet probe 2>&1 && echo NFT_OK || echo NFT_FAIL
      sleep 600
