[server]
host = "127.0.0.1"
port = 18081
api_key = "spike-key"
[proxy]
resolve_internal = false
[log]
level = "INFO"
[runtime]
type = "docker"
execd_image = "ade-execd-proto:0"
[store]
type = "sqlite"
path = "/tmp/spikes/os2.db"
[docker]
network_mode = "bridge"
port_range_min = 42000
port_range_max = 42400
host_ip = "127.0.0.1"
[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns+nft"
